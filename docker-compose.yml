services:
  db:
    image: postgres:16-alpine
    container_name: opm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opm_user
      POSTGRES_PASSWORD: opm_password
      POSTGRES_DB: opm_db
    ports:
      - "5432:5432"
    volumes:
      - opm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opm_user -d opm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://opm_user:opm_password@db:5432/opm_db
      - SYNC_DATABASE_URL=postgresql+psycopg://opm_user:opm_password@db:5432/opm_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opm_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://opm_user:opm_password@db:5432/opm_db
      - SYNC_DATABASE_URL=postgresql+psycopg://opm_user:opm_password@db:5432/opm_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q imports,webhooks,celery

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  opm_pgdata:
